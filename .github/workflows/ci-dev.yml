# ──────────────────────────────────────────────────────────────
# CI Pipeline — Dev Branch
# ──────────────────────────────────────────────────────────────
name: CI (dev)

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile.test"
      - "docker-compose.test.yml"
      - "requirements.txt"
  pull_request:
    branches: [dev]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint with Ruff
        run: ruff check src/ tests/

  # ── 2. SAST ────────────────────────────────────────────────
  sast:
    name: Security Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r src/ -ll

  # ── 3. Test ────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Run tests via Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test-runner

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
# ──────────────────────────────────────────────────────────────
# Docker Compose — Test environment
#
# Spins up a real PostgreSQL instance and runs pytest against it.
# Usage:  docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
# ──────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: test_db
      CART_SERVICE_URL: http://cart-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8000
      PAYMENTS_SERVICE_URL: http://payments-service:8000
      PENDING_PAYMENT_EXPIRATION_ENABLED: "false"
      PENDING_PAYMENT_EXPIRATION_MINUTES: "30"
      PENDING_PAYMENT_EXPIRATION_BATCH_SIZE: "50"
      PENDING_PAYMENT_EXPIRATION_INTERVAL_SECONDS: "300"
      OTEL_SERVICE_NAME: orders
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=test,k8s.cluster.name=bazaar-dev
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_TRACES_SAMPLER: always_on
    depends_on:
      db:
        condition: service_healthy

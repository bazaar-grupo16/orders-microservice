# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Orders PostgreSQL Database
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  labels:
    app: orders-db
spec:
  type: ClusterIP
  selector:
    app: orders-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

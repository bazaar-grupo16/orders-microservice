# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Orders Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  labels:
    app: orders-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      labels:
        app: orders-service
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: orders-service
          image: $IMAGE_NAME:$IMAGE_TAG
          ports:
            - containerPort: 8000
          # ── Environment from Kubernetes Secret ──────
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: orders-db-credentials
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: orders-db-credentials
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orders-db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db-credentials
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: orders-db-credentials
                  key: DB_NAME
            - name: CART_SERVICE_URL
              value: "http://cart-service"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service"
            - name: NOTIFICATIONS_SERVICE_URL
              value: "http://notifications-service"
            - name: PAYMENTS_SERVICE_URL
              value: "http://payments-service"
            - name: PENDING_PAYMENT_EXPIRATION_ENABLED
              value: "true"
            - name: PENDING_PAYMENT_EXPIRATION_MINUTES
              value: "30"
            - name: PENDING_PAYMENT_EXPIRATION_BATCH_SIZE
              value: "50"
            - name: PENDING_PAYMENT_EXPIRATION_INTERVAL_SECONDS
              value: "300"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: orders-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=dev,k8s.cluster.name=bazaar-dev"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          # ── Resources ──────────────────────────────
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi

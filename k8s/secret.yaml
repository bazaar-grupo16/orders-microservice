# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Orders PostgreSQL Database
# ──────────────────────────────────────────────────────────────
# Complete secrets in GitHub repository secrets
apiVersion: v1
kind: Secret
metadata:
  name: orders-db-credentials
type: Opaque
stringData:
  DB_HOST: orders-db
  DB_PORT: "5432"
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  DB_NAME: $DB_NAME
